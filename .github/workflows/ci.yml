name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build every example and project
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Known vulnerabilities in the toolchain and dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
